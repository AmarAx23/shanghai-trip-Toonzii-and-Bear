<head>

<title>ทริปแบบแอนิเมชัน</title>
<link rel="icon" href="favicon.ico">
<link rel="manifest" href="manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* VOICE: a winter travel diary that moves — cosy, festive, clear
   IDEA: a Morph deck: one map, a camera flying Bangkok → Shanghai and day by day
   PICTURE: snowy cream land on deep teal sea, Huangpu river, red day pins, gold hotel star, falling snow
   COLOUR and TYPE: #0F3A54 teal (their page), snow cream, Christmas red #e2453c, star gold #f5c451; Kanit + Sarabun + Noto Sans SC
   LAYOUT: 16:9 stage with the day card over a dark left scrim; on phones the card drops below the stage */
:root{color-scheme:dark;--bg:#09283a;--sea:#0f3a54;--snow:#f3efe6;--red:#e2453c;--gold:#f5c451;--ink:#f7f1e6;--mute:#a8c4d2}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Sarabun,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(14px,3vw,36px) max(4vw,10px)}
.box{position:relative;container-type:inline-size;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px #0009}
.stage{position:relative;aspect-ratio:16/9;background:var(--sea);cursor:pointer;user-select:none;overflow:hidden}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scrim{position:absolute;inset:0;background:linear-gradient(90deg,#0b2f44f2 0%,#0b2f44d9 33%,#0b2f4400 52%);pointer-events:none}
.snow{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.snow i{position:absolute;top:-10px;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.7;animation:fall linear infinite}
@keyframes fall{to{transform:translate(30px,110cqw)}}
#ttl{position:absolute;left:5%;top:24%;margin:0;font:700 4.6cqw/1.05 Kanit,sans-serif;color:var(--ink);pointer-events:none;transition:top 1.4s cubic-bezier(.65,0,.35,1),font-size 1.4s cubic-bezier(.65,0,.35,1),color 1.4s}
#ttl small{display:block;font:400 .34em Sarabun,sans-serif;color:var(--gold);margin-top:.55em;transition:opacity .6s}
.zoomed #ttl{top:4.5%;font-size:1.5cqw;color:var(--gold)}
.zoomed #ttl small{opacity:0}
.panel{position:absolute;left:0;top:0;bottom:0;width:44%;pointer-events:none}
.card{position:absolute;left:11.5%;right:4%;top:12%;opacity:0;transform:translateX(-3cqw);transition:opacity .6s,transform .8s cubic-bezier(.2,.8,.2,1)}
.card.on{opacity:1;transform:none;transition-delay:.9s}
.card.ov{top:50%}
.chips{display:flex;flex-wrap:wrap;gap:.5em}
.chip{background:var(--gold);color:#3b2700;font:600 1.15cqw Kanit,sans-serif;padding:.2em .75em;border-radius:99px;white-space:nowrap}
.chip.t{background:#ffffff1f;color:var(--ink)}
.card h2{font:700 2.9cqw/1.08 Kanit,sans-serif;margin:.35em 0 .05em;text-wrap:balance}
.zh{margin:0 0 .7em;color:var(--mute);font:500 1.35cqw "Noto Sans SC",sans-serif}
.card ol{list-style:none;margin:0;padding:0;font-size:1.3cqw}
.card li{display:grid;grid-template-columns:3.6em 1fr auto;gap:.6em;align-items:center;padding:.28em 0;border-top:1px solid #ffffff1c}
.tm{color:var(--gold);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.b{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--red);color:#fff;font:600 .85em Kanit,sans-serif;border:2px solid #fff}
.b.h{background:var(--gold);color:#3b2700}
.stat{font-size:1.3cqw;color:var(--mute);margin:.8em 0 0}
.stat b{color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
button{font:600 15px Kanit,sans-serif;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid #ffffff30;background:#103c55;color:var(--ink);cursor:pointer}
button:hover{background:#155070}button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.pri{background:var(--gold);color:#3b2700;border-color:var(--gold)}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.dots button{font-weight:400;padding:0 11px}
.dots button[aria-current=true]{border-color:var(--gold);color:var(--gold)}
.note{margin-top:12px;font-size:13px;color:var(--mute)}
.back{display:inline-flex;align-items:center;min-height:44px;margin-bottom:10px;color:var(--gold);font:600 15px Kanit,sans-serif;text-decoration:none}
.back:hover{text-decoration:underline}
@media(max-width:980px){
  .stage{aspect-ratio:4/3}
  .scrim{display:none}
  #ttl,.zoomed #ttl{top:4%;left:4%;font-size:15px;color:var(--gold);background:#0b2f44d9;padding:.3em .7em;border-radius:8px}
  #ttl small{display:none}
  .panel{position:static;width:auto;background:#0c3349;padding:16px 16px 18px}
  .card{position:static;display:none;opacity:1;transform:none}
  .card.on{display:block}
  .chip{font-size:13px}.card h2{font-size:24px}.zh{font-size:15px}.card ol{font-size:15px}.stat{font-size:15px}
  .dots{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){.snow{display:none}#ttl,.card{transition:none!important}}
</style>
</head>

const fit=(pts,pad,px)=>{const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);const s=Math.min(170,720/(x1-x0+pad),620/(y1-y0+pad));return{f:[(x0+x1)/2,(y0+y1)/2],s,p:[px,470]}};
D.forEach((d,i)=>{

  else{d.cam=fit(d.fit==='pins'?d.pp:[...d.pp,HOTEL],d.fit==='pins'?1.6:1.2,1150);d.r=1}

const cam=document.getElementById('cam'),stage=document.getElementById('stage'),plane=document.getElementById('plane'),hotel=document.getElementById('hotel'),G2=document.getElementById('grid');
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t<.5?4*t*t*t:1-(-2*t+2)**3/2;
const arcPt=(A,B,t,k=.2)=>{const mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2,dx=B[0]-A[0],dy=B[1]-A[1],cx=mx-dy*k,cy=my+dx*k,u=1-t;return[u*u*A[0]+2*u*t*cx+t*t*B[0],u*u*A[1]+2*u*t*cy+t*t*B[1]]};
const arcPts=(A,B,lim)=>{const o=[];if(lim<=0)return o;for(let j=0;j<=48;j++){const t=Math.min(lim,j/48);o.push(arcPt(A,B,t));if(t>=lim)break}return o};
let narrow=false,idx=0,anim=null,cur={f:[...D[0].cam.f],s:D[0].cam.s,p:[...D[0].cam.p],r:0};
const px=c=>narrow?[800,450]:c.p;

function draw(c){
  const p=px(c),tx=p[0]-c.f[0]*c.s,ty=p[1]-c.f[1]*c.s,S=q=>[tx+q[0]*c.s,ty+q[1]*c.s],T=q=>{const v=S(q);return`translate(${v[0].toFixed(1)} ${v[1].toFixed(1)})`+(narrow?' scale(1.8)':'')};
  cam.setAttribute('transform',`translate(${tx.toFixed(2)} ${ty.toFixed(2)}) scale(${c.s.toFixed(5)})`);
  G2.style.opacity=clamp((c.s-25)/50);
  const aOp=clamp((3-c.s)/2),rOp=clamp((c.s-2.5)/2)*clamp((20-c.s)/8),cOp=clamp((c.s-6)/6);
  L.forEach((l,i)=>{const e=document.getElementById('L'+i);e.setAttribute('transform',T(l.p));e.style.opacity=l.w==='asia'?aOp:rOp});
  const a1=arcPts(BKK,PVG,clamp(c.r)).map(S),a2=arcPts(PVG,BKK,clamp(c.r-1)).map(S),pl=a=>a.map(v=>v[0].toFixed(1)+','+v[1].toFixed(1)).join(' ');
  document.getElementById('arc1').setAttribute('points',pl(a1));document.getElementById('arc2').setAttribute('points',pl(a2));
  document.getElementById('arcs').style.opacity=aOp;
  const fr=c.r-Math.floor(c.r),act=c.r<1?a1:a2;
  if(fr>.02&&fr<.98&&act.length>1){const a=act[act.length-1],b=act[act.length-2];plane.setAttribute('transform',`translate(${a[0].toFixed(1)} ${a[1].toFixed(1)}) rotate(${(Math.atan2(a[1]-b[1],a[0]-b[0])*180/Math.PI).toFixed(1)})`);plane.style.opacity=1}else plane.style.opacity=0;
  hotel.setAttribute('transform',T(HOTEL));hotel.style.opacity=cOp;
  D.forEach((d,i)=>{if(!d.pp.length)return;const g=document.getElementById('dg'+i);
    g.querySelectorAll('.dp').forEach((n,k)=>n.setAttribute('transform',T(d.pp[k])));
    g.querySelector('.rt').setAttribute('points',d.route.map(r=>S(r==='h'?HOTEL:d.pp[+r.slice(1)-1])).map(v=>v[0].toFixed(1)+','+v[1].toFixed(1)).join(' '));
    g.setAttribute('opacity',cOp)});
}

function planner(from,to){
  const l0=Math.log(from.s),l1=Math.log(to.s),d=Math.hypot(to.f[0]-from.f[0],to.f[1]-from.f[1]),lfit=Math.log(1100/(d+1e-6));
  const c=lfit<Math.min(l0,l1)?2*lfit-(l0+l1)/2:(l0+l1)/2;
  const N=160,ls=[],cum=[0];for(let i=0;i<=N;i++){const e=i/N;ls.push((1-e)**2*l0+2*e*(1-e)*c+e*e*l1)}
  for(let i=1;i<=N;i++)cum.push(cum[i-1]+(Math.exp(-ls[i-1])+Math.exp(-ls[i]))/2);
  const tot=cum[N]||1,dip=c<Math.min(l0,l1);
  return{dip,at:e=>{const x=e*N,i=Math.min(N-1,Math.floor(x)),f=x-i;return{s:Math.exp(lerp(ls[i],ls[i+1],f)),u:lerp(cum[i],cum[i+1],f)/tot}}};
}

function go(i){
  i=Math.max(0,Math.min(D.length-1,i));
  const from={f:[...cur.f],s:cur.s,p:[...cur.p],r:cur.r},to=D[i];idx=i;
  stage.classList.toggle('zoomed',i>0);
  document.querySelectorAll('.card').forEach(el=>el.classList.toggle('on',+el.dataset.i===i));
  document.querySelectorAll('.dg').forEach(g=>{const on=g.id==='dg'+i;g.style.transitionDelay=on?'1.1s':'0s';g.style.opacity=on?1:0});
  ui();
  const pl=planner(from,to.cam),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dur=reduce?1:clamp(1500+Math.abs(Math.log(to.cam.s/from.s))*160+(pl.dip?700:0),1500,3000);
  const t0=performance.now();cancelAnimationFrame(anim);
  const step=now=>{const t=Math.min(1,(now-t0)/dur),e=ease(t),q=pl.at(e);
    cur={s:q.s,f:[lerp(from.f[0],to.cam.f[0],q.u),lerp(from.f[1],to.cam.f[1],q.u)],p:[lerp(from.p[0],to.cam.p[0],e),lerp(from.p[1],to.cam.p[1],e)],r:lerp(from.r,to.r,e)};
    draw(cur);anim=t<1?requestAnimationFrame(step):null};
  anim=requestAnimationFrame(step);
}

const labels=['ภาพรวม','วัน 1','วัน 2','วัน 3','วัน 4','วัน 5','วัน 6','วัน 7','วัน 8'];

function ui(){dots.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',+b.dataset.i===idx));document.getElementById('prev').disabled=idx===0}
const nxt=()=>go(idx===D.length-1?0:idx+1);
let timer=null;const autoB=document.getElementById('auto');
function stop(){if(timer){clearInterval(timer);timer=null;autoB.textContent='▶ เล่นอัตโนมัติ'}}
dots.addEventListener('click',e=>{const b=e.target.closest('button');if(b){stop();go(+b.dataset.i)}});
document.getElementById('next').onclick=()=>{stop();nxt()};
document.getElementById('prev').onclick=()=>{stop();go(idx-1)};
stage.onclick=()=>{stop();nxt()};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();nxt()}if(e.key==='ArrowLeft'){stop();go(idx-1)}});
autoB.onclick=()=>{if(timer){stop();return}autoB.textContent='❚❚ หยุด';nxt();timer=setInterval(nxt,5200)};
const ro=new ResizeObserver(()=>{narrow=document.getElementById('box').clientWidth<980;draw(cur)});ro.observe(document.getElementById('box'));
document.querySelector('.card').classList.add('on');ui();draw(cur);
}
