<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ทริปแบบแอนิเมชัน</title>
<meta name="theme-color" content="#0b1020">
<link rel="icon" href="favicon.ico">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&family=Sarabun:wght@400;500;600&family=Noto+Sans+SC:wght@500&family=Noto+Serif+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
:root{color-scheme:dark;--bg:#0b2333;--panel:#0f2e42f2;--line:#ffffff1f;--ink:#f7f1e6;--mute:#a9c3d0;--red:#e2453c;--gold:#f5c451;--teal:#0f3a54}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;position:fixed;inset:0;width:100%;background:var(--bg);color:var(--ink);font:16px/1.5 Sarabun,system-ui,sans-serif;overflow:hidden}
#map{position:fixed;inset:0;z-index:0;isolation:isolate;background:#dfe6e8}
/* wintery, slightly desaturated real map */
#map .leaflet-tile-pane{will-change:transform}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:400;background:radial-gradient(120% 90% at 65% 45%,transparent 55%,#0b233399 100%)}
.snow{position:fixed;inset:0;pointer-events:none;z-index:450;overflow:hidden}
.snow i{position:absolute;top:-12px;border-radius:50%;background:#fff;will-change:transform;animation:fall linear infinite}
@keyframes fall{to{transform:translate(40px,110vh)}}
.snow{transition:opacity .8s,visibility 0s}
body.incity .snow{opacity:0;visibility:hidden;transition:opacity .8s,visibility 0s .8s}
body.incity .snow i{animation-play-state:paused}

/* top bar */
.top{position:fixed;top:0;left:0;right:0;z-index:600;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(#0b2333e6,#0b233300);pointer-events:none}
.top>*{pointer-events:auto}
.back{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;background:#0b2333cc;border:1px solid var(--line);color:var(--gold);font:600 14px Kanit,sans-serif;text-decoration:none}
.brand{font:700 18px Kanit,sans-serif;text-shadow:0 2px 10px #000a}
.brand small{display:block;font:400 12px Sarabun,sans-serif;color:var(--gold)}

/* card */
.card{position:fixed;z-index:650;left:18px;top:76px;bottom:96px;width:min(400px,38vw);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px #0008;overflow:hidden;transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1)}
.card.out{opacity:0;transform:translateX(-24px)}
.cover{position:relative;flex:none;height:150px;background:#123 center/cover no-repeat}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(#0000 35%,#0f2e42 100%)}
.cover .chips{position:absolute;left:14px;bottom:10px;z-index:1;display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--gold);color:#3b2700;font:600 13px Kanit,sans-serif;padding:3px 10px;border-radius:99px;white-space:nowrap}
.chip.t{background:#0b2333cc;color:var(--ink);border:1px solid var(--line)}
.head{flex:none;padding:10px 16px 6px}
.head h2{margin:0;font:700 24px/1.15 Kanit,sans-serif;text-wrap:balance}
.head .zh{margin:2px 0 0;color:var(--mute);font:500 14px "Noto Sans SC",sans-serif}
.list{position:relative;flex:1;overflow:auto;padding:4px 10px 12px;overscroll-behavior:contain}
.it{display:grid;grid-template-columns:46px 54px 1fr 26px;gap:10px;align-items:center;padding:7px 6px;border-radius:12px;cursor:pointer;transition:background .2s}
.it:hover,.it.act{background:#ffffff14}
.it .tm{color:var(--gold);font:600 14px Kanit,sans-serif;font-variant-numeric:tabular-nums}
.it .ph{width:54px;height:40px;border-radius:8px;background:#1b3d52 center/cover no-repeat;display:grid;place-items:center;font-size:18px}
.it .tx{font-size:14px;line-height:1.35}
.b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font:600 12px Kanit,sans-serif;border:2px solid #fff}
.b.h{background:var(--gold);color:#3b2700}
.ov p{margin:8px 0;color:var(--mute)} .ov b{color:var(--ink)}

/* markers */
.pin{width:30px;height:30px;border-radius:50%;background:var(--red);border:3px solid #fff;color:#fff;font:700 13px Kanit,sans-serif;display:grid;place-items:center;box-shadow:0 4px 12px #0007;transform:scale(0);animation:pop .45s cubic-bezier(.3,1.6,.5,1) forwards}
.pin.act{background:var(--gold);color:#3b2700;transform:scale(1.25)!important;animation:none;box-shadow:0 0 0 8px #f5c45155,0 4px 12px #0007}
@keyframes pop{to{transform:scale(1)}}
.star{font-size:30px;line-height:30px;text-align:center;filter:drop-shadow(0 3px 4px #0008)}
.star span{position:absolute;left:30px;top:4px;white-space:nowrap;font:600 13px Kanit,sans-serif;color:#0f3a54;background:#fffd;padding:1px 8px;border-radius:99px}
.city{font:700 15px Kanit,sans-serif;color:#fff;background:#e2453c;border:2px solid #fff;border-radius:99px;padding:2px 10px;white-space:nowrap;box-shadow:0 4px 12px #0007;transform:translate(-10%,-50%);display:inline-block}
.plane{font-size:34px;line-height:34px;filter:drop-shadow(0 4px 6px #0009);transition:none}
.rt{stroke-dasharray:2 12;stroke-linecap:round}
.arc{stroke-dasharray:3 10;stroke-linecap:round}

.seg{display:inline-block;transform:translate(-50%,-50%) scale(0);white-space:nowrap;font:600 12px Kanit,sans-serif;color:#0f3a54;background:#fffffff0;border:1.5px solid #e2453c;border-radius:99px;padding:2px 8px;box-shadow:0 3px 8px #0005;animation:pop2 .4s ease-out forwards}
.seg.act{background:#e2453c;color:#fff;border-color:#fff}
@keyframes pop2{to{transform:translate(-50%,-50%) scale(1)}}
.legs{margin:6px 0 0;font-size:13px;color:var(--mute)}
.storyb{margin-top:8px;min-height:36px;padding:0 12px;font-size:13px;background:#e2453c;border-color:#e2453c;color:#fff}
.storyb:hover{background:#c93a32}
.story-pop .leaflet-popup-content-wrapper{padding:0;border-radius:14px;overflow:hidden;background:#0f2e42;color:#f7f1e6;box-shadow:0 12px 30px #0009}
.story-pop .leaflet-popup-content{margin:0;width:240px!important}
.story-pop .leaflet-popup-tip{background:#0f2e42}
.sp-img{height:140px;background:#123 center/cover no-repeat}
.sp-t{padding:8px 12px 10px;font:14px/1.4 Sarabun,sans-serif}
.sp-t b{color:#f5c451;font-family:Kanit,sans-serif;margin-right:4px}
@media(max-width:820px){.story-pop .leaflet-popup-content{width:180px!important}.sp-img{height:84px}.sp-t{font-size:13px;padding:6px 10px 8px}}

/* ---- motion ---- */
:root{view-transition-name:none}
::view-transition{pointer-events:none}
.card{view-transition-name:card}
.cover{view-transition-name:cover}
.head h2{view-transition-name:ttl}
.vtpic .card,.vtpic .cover,.vtpic .head h2{view-transition-name:none}
::view-transition-group(*){animation-duration:.6s;animation-timing-function:cubic-bezier(.2,.85,.25,1)}
::view-transition-old(card){animation:.2s ease-in both vt-fade}
::view-transition-new(card){animation:.4s .08s ease-out both vt-show}
@keyframes vt-show{from{opacity:0}}
::view-transition-old(ttl){animation:.22s ease-in both vt-out}
::view-transition-new(ttl){animation:.45s .14s cubic-bezier(.2,.85,.25,1) both vt-in}
::view-transition-old(cover){animation:.5s ease both vt-fade}
::view-transition-new(cover){animation:.6s cubic-bezier(.2,.85,.25,1) both vt-zoom}
::view-transition-group(pic){animation-duration:.55s;animation-timing-function:cubic-bezier(.3,1.25,.45,1);z-index:9}
::view-transition-old(pic),::view-transition-new(pic){height:100%;object-fit:cover;border-radius:10px;overflow:hidden}
@keyframes vt-out{to{opacity:0;transform:translateY(-10px)}}
@keyframes vt-in{from{opacity:0;transform:translateY(12px)}}
@keyframes vt-fade{to{opacity:0}}
@keyframes vt-zoom{from{opacity:0;transform:scale(1.06)}}
.cover{overflow:hidden}
.cv{position:absolute;inset:0;background:#123 center/cover no-repeat;animation:kb 1.4s cubic-bezier(.2,.8,.3,1) both}
@keyframes kb{from{transform:scale(1.07)}to{transform:scale(1)}}
.it{animation:itin .5s cubic-bezier(.2,.85,.25,1) both;animation-delay:calc(var(--i,0) * 45ms + 120ms)}
@keyframes itin{from{opacity:0;transform:translateX(-14px)}}
.it .ph{transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.it.act .ph{transform:scale(1.08)}
.pin{transition:background .3s,color .3s,box-shadow .3s}
.seg{transition:background .3s,color .3s,border-color .3s}
button{transition:transform .14s,background .2s,color .2s}
button:active{transform:scale(.95)}
.dots{position:relative}
.dots button[aria-current=true]{border-color:#ffffff30}
.pill{position:absolute;left:0;top:0;border:2px solid var(--gold);border-radius:12px;pointer-events:none;opacity:0;box-shadow:0 0 14px #f5c45155;transition:transform .5s cubic-bezier(.3,1.3,.45,1),width .5s cubic-bezier(.3,1.3,.45,1),opacity .3s}
.pill.on{opacity:1}
.prog{display:flex;gap:4px;margin-top:10px;transition:opacity .4s}
.prog.done{opacity:0}
.prog i{flex:1;height:3px;border-radius:3px;background:#ffffff26;overflow:hidden}
.prog b{display:block;height:100%;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform linear}
.prog i.on b{transform:scaleX(1)}
.story-pop .leaflet-popup-content-wrapper,.story-pop .leaflet-popup-tip-container{transform-origin:50% 100%;animation:spop .5s cubic-bezier(.3,1.45,.5,1) both}
.story-pop.morph .leaflet-popup-content-wrapper{animation-duration:.45s}
@keyframes spop{from{opacity:0;transform:translateY(10px) scale(.82)}}
.sp-t{animation:vt-in .4s .18s cubic-bezier(.2,.85,.25,1) both}
@media(prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}.cv,.it,.story-pop .leaflet-popup-content-wrapper,.story-pop .leaflet-popup-tip-container,.sp-t{animation:none}.pill{transition:none}}
/* controls */
.bar{position:fixed;z-index:700;left:0;right:0;bottom:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;background:linear-gradient(#0b233300,#0b2333ee 40%);flex-wrap:wrap}
button{font:600 14px Kanit,sans-serif;min-height:42px;padding:0 14px;border-radius:12px;border:1px solid #ffffff30;background:#103c55;color:var(--ink);cursor:pointer}
button:hover{background:#155070}button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.pri{background:var(--gold);color:#3b2700;border-color:var(--gold)}
.dots{display:flex;gap:6px;overflow-x:auto;margin-left:auto;scrollbar-width:none}
.dots::-webkit-scrollbar{display:none}
.dots button{padding:0 11px;font-weight:400;flex:none}
.dots button[aria-current=true]{border-color:var(--gold);color:var(--gold)}
.leaflet-control-attribution{font-size:10px;background:#fffc!important}
.leaflet-bottom.leaflet-right{bottom:70px}


/* ===== luxe theme (matches the presentation) ===== */
:root{--bg:#0b1020;--panel:#0d1530eb;--line:#d9b26a33;--ink:#f5ecd7;--mute:#b9b3a3;--gold:#d9b26a;--gold2:#e9cf95;--navy:#141c33;--serif:'Noto Serif Thai',Georgia,serif}
#map{background:#0b1020}
.tl-dark,.tl-light{transition:opacity 1.2s ease}
.tl-light{opacity:0!important;filter:sepia(.28) saturate(.75) brightness(1.03)}
body.incity .tl-light{opacity:1!important}
body.incity .tl-dark{opacity:0!important}
.vignette{background:radial-gradient(120% 90% at 65% 45%,transparent 55%,#0b102099 100%)}
body.incity .vignette{background:radial-gradient(120% 90% at 65% 45%,transparent 60%,#3a2c1033 100%)}
.top{background:linear-gradient(#0b1020e6,#0b102000)}
.back{background:#0d1530cc;border-color:var(--line);color:var(--gold2);font-weight:500}
.brand{font:500 19px var(--serif);letter-spacing:.01em}
.brand small{font:600 11px Kanit,sans-serif;letter-spacing:.28em;color:var(--gold);text-transform:uppercase}
.card{background:var(--panel);border:1px solid var(--line);box-shadow:0 24px 70px #000a}
.cover::after{background:linear-gradient(#0000 30%,#0d1530 100%)}
.chip{background:transparent;color:var(--gold2);border:1px solid var(--gold);font:600 12px Kanit,sans-serif;letter-spacing:.04em}
.chip.t{background:#0b1020aa;color:var(--ink);border-color:#ffffff30}
.head h2{font:500 26px/1.25 var(--serif);color:var(--ink)}
.head .zh{color:var(--gold);opacity:.85}
.legs{color:var(--mute)}
.it:hover,.it.act{background:#d9b26a1c}
.it .tm{color:var(--gold2);font:600 15px var(--serif)}
.it .ph{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);background-color:var(--navy);font-size:16px}
.it{grid-template-columns:46px 42px 1fr 26px}
.it .tx{color:var(--ink)}
.b{background:var(--navy);color:var(--gold2);border:1.5px solid var(--gold);font:500 12px var(--serif)}
.b.h{background:var(--gold);color:var(--navy)}
.storyb{background:transparent;border:1px solid var(--gold);color:var(--gold2)}
.storyb:hover{background:#d9b26a22}
.prog b{background:var(--gold)}
/* overview day list */
.ovl{display:flex;flex-direction:column;gap:6px;padding:2px 4px 6px}
.ovr{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:6px 8px;border-radius:12px;cursor:pointer;transition:background .2s;animation:itin .5s cubic-bezier(.2,.85,.25,1) both;animation-delay:calc(var(--i,0) * 55ms + 150ms)}
.ovr:hover{background:#d9b26a1c}
.ovr .ph{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);background:var(--navy) center/cover no-repeat}
.ovr b{display:block;font:500 15px/1.3 var(--serif);color:var(--ink)}
.ovr small{display:block;font:600 10.5px Kanit,sans-serif;letter-spacing:.2em;color:var(--gold)}
.ovr em{font:400 12px Sarabun,sans-serif;font-style:normal;color:var(--mute);white-space:nowrap}
.ovsum{margin:2px 10px 10px;padding:10px 0 2px;border-top:1px solid var(--line);color:var(--mute);font-size:13px}
.ovsum b{color:var(--gold2);font-weight:600}
/* map marks */
.mpin{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--gold);background:var(--navy) center/cover no-repeat;box-shadow:0 6px 18px #0b102066;position:relative;transform:scale(0);animation:pop .5s cubic-bezier(.3,1.5,.5,1) forwards;transition:box-shadow .3s}
.mpin i{position:absolute;right:-6px;top:-6px;width:20px;height:20px;border-radius:50%;background:var(--navy);border:1.5px solid var(--gold);color:var(--gold2);font:500 11px/17px var(--serif);text-align:center;font-style:normal}
.mpin.act{transform:scale(1.22)!important;animation:none;box-shadow:0 0 0 6px #d9b26a55,0 8px 22px #0b102077}
.mpin.noimg{display:grid;place-items:center;color:var(--gold2);font:500 17px var(--serif)}
.hstar{width:40px;height:40px;border-radius:50%;background:var(--navy) url(img/present/hotel.png) center/58% no-repeat;border:2px solid var(--gold);box-shadow:0 6px 16px #0b102066;position:relative}
.hstar span{position:absolute;left:46px;top:9px;white-space:nowrap;font:500 13px var(--serif);color:var(--navy);background:#fbf6ea;border:1px solid var(--gold);padding:0 9px;border-radius:99px}
.ctag{display:flex;align-items:center;gap:10px;transform:translate(-9px,-9px);white-space:nowrap;pointer-events:none}
.ctag .cd{width:18px;height:18px;border-radius:50%;background:var(--gold2);box-shadow:0 0 0 0 #e9cf9599;animation:pulse 2.2s ease-out infinite}
.ctag .cn{font:500 17px var(--serif);color:#f5ecd7;text-shadow:0 2px 10px #000c;letter-spacing:.02em}
.ctag .cn small{display:block;font:600 10px Kanit,sans-serif;letter-spacing:.3em;color:var(--gold)}
@keyframes pulse{0%{box-shadow:0 0 0 0 #e9cf9599}80%,100%{box-shadow:0 0 0 18px #e9cf9500}}
body.incity .ctag .cd{animation:none}
.plane2{filter:drop-shadow(0 0 8px #e9cf95aa) drop-shadow(0 4px 6px #0009)}
.plane2 svg{width:36px;height:36px;display:block}
.arcg{filter:drop-shadow(0 0 6px #e9cf95)}
.seg{color:var(--gold2);background:#0d1530f2;border:1px solid var(--gold);font:500 12px Kanit,sans-serif}
.seg.act{background:var(--gold);color:var(--navy);border-color:var(--gold2)}
.story-pop .leaflet-popup-content-wrapper{background:#0d1530;border:1px solid var(--gold);color:var(--ink)}
.story-pop .leaflet-popup-tip{background:#0d1530;border:1px solid var(--gold)}
.sp-t{font:500 15px/1.4 var(--serif)}
.sp-t b{color:var(--gold2);font:600 15px var(--serif)}
/* controls */
.bar{background:linear-gradient(#0b102000,#0b1020ee 40%)}
button{background:#0d1530d9;border-color:#ffffff26;font-weight:500}
button:hover{background:#1a2442}
.pri{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:600}
.pri:hover{background:var(--gold2)}
.dots button[aria-current=true]{color:var(--gold2)}
.pill{border-color:var(--gold);box-shadow:0 0 14px #d9b26a55}
.leaflet-control-attribution{background:#0b1020aa!important;color:#c9c3b3}
.leaflet-control-attribution a{color:var(--gold2)}
@media(max-width:820px){
  .card{left:10px;right:10px;width:auto;top:auto;bottom:118px;max-height:44vh}
  .cover{height:96px}
  .head h2{font-size:20px}
  .bar{gap:6px}
  .bar>button{flex:1;padding:0 8px;white-space:nowrap;font-size:13px}
  .dots{margin-left:0;width:100%}
  .leaflet-bottom.leaflet-right{bottom:calc(44vh + 124px)}
}
@media(prefers-reduced-motion:reduce){.snow{display:none}}
</style>
</head>
<body>
<div id="map" aria-label="แผนที่ทริป"></div>
<div class="vignette"></div>
<div class="snow" id="snow"></div>
<div class="top"><a class="back" href="./">← กลับไปหน้าแผน</a><div class="brand">เซี่ยงไฮ้ 8 วัน 7 คืน<small>Toonzii &amp; Bear · 5–12 ธ.ค. 2026</small></div></div>
<section class="card" id="card" aria-live="polite"></section>
<div class="bar">
  <button id="prev">←</button>
  <button id="next" class="pri">ถัดไป →</button>
  <button id="auto">▶ เล่นอัตโนมัติ</button>
  <div class="dots" id="dots"></div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>

  plane = L.marker(pts[0], { icon: L.divIcon({ className: 'plane2', html: '<div id="pl">' + PLANE_SVG + '</div>', iconSize: [36, 36], iconAnchor: [18, 18] }), interactive: false, zIndexOffset: 1000 }).addTo(map);
  var t0 = performance.now();
  (function step(now) { var t = Math.min(1, (now - t0) / ms), e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2, i = Math.min(pts.length - 2, Math.floor(e * (pts.length - 1)));
    var a = pts[i], b = pts[i + 1], f = e * (pts.length - 1) - i, p = [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
    plane.setLatLng(p); if (trail) trail.set(pts.slice(0, i + 1).concat([p]));
    var pa = map.latLngToLayerPoint(a), pb = map.latLngToLayerPoint(b), ang = Math.atan2(pb.y - pa.y, pb.x - pa.x) * 180 / Math.PI;
    var el = document.getElementById('pl'); if (el) el.style.transform = 'rotate(' + ang + 'deg)';
    if (t < 1) requestAnimationFrame(step); else if (done) done(); })(t0);
}

/* padding so the card never hides pins */
function pad() { var w = innerWidth, h = innerHeight; return w <= 820 ? { tl: [30, 80], br: [30, Math.round(h * .44) + 140] } : { tl: [Math.min(430, w * .38) + 40, 90], br: [50, 110] }; }
function fitTo(latlngs, maxZoom, dur) { var p = pad(); map.flyToBounds(L.latLngBounds(latlngs), { paddingTopLeft: p.tl, paddingBottomRight: p.br, maxZoom: maxZoom || 15, duration: reduce ? 0 : (dur || 2.4) }); }

var idx = 0, pinEls = [], segEls = [], gen = 0, playing = false;
function card(d) {
  var c = $('#card');
  if (d.ov) {
    c.innerHTML = '<div class="cover"><div class="cv" style="background-image:url(' + (d.cover || '') + ')"></div><div class="chips"><span class="chip">5–12 ธ.ค. 2026</span><span class="chip t">8 วัน 7 คืน</span></div></div>' +
      '<div class="head"><h2>เซี่ยงไฮ้ + ซูโจว</h2><p class="zh">上海 · 苏州</p></div><div class="list ov"><div class="ovl">' +
      D.slice(1).map(function (x, k) { return '<div class="ovr" style="--i:' + k + '" data-go="' + (k + 1) + '"><span class="ph" style="background-image:url(' + String(x.cover || '').replace('-1280.', '-640.') + ')"></span><span><small>DAY ' + (k < 9 ? '0' : '') + (k + 1) + '</small><b>' + esc(x.h) + '</b></span><em>' + esc(String(x.d).split('·').pop().trim()) + '</em></div>'; }).join('') +
      '</div><p class="ovsum">ที่พัก <b>Atour X Hotel</b> ถนน Huaihai · <b>Metro + Didi</b> · งบราว <b>' + TOTAL + ' บาท/คน</b></p></div>';
    return;
  }
  var legs = (d.segs || []).length ? '<p class="legs">' + d.segs.map(function (g) { return g.m; }).join(' ') + ' · ' + legSummary(d.segs) + '</p>' : '';
  c.innerHTML = '<div class="cover"><div class="cv" style="background-image:url(' + (d.cover || '') + ')"></div><div class="chips"><span class="chip">' + esc(d.d) + '</span>' + (d.tp ? '<span class="chip t">' + esc(d.tp) + '</span>' : '') + '</div></div>' +
    '<div class="head"><h2>' + esc(d.h) + '</h2><p class="zh">' + esc(d.zh) + '</p>' + legs + (d.pins && d.pins.length > 1 ? '<button type="button" class="storyb" id="storyb">▶ เล่นทีละจุด</button>' : '') + '</div><div class="list">' +
    d.it.map(function (x, k) { return '<div class="it" style="--i:' + Math.min(k, 10) + '" data-k="' + k + '"' + (x.pin ? ' data-pin="' + x.pin + '"' : '') + '><span class="tm">' + x.t + '</span><span class="ph"' + (x.img ? ' style="background-image:url(' + x.img + ')"' : '') + '>' + (x.img ? '' : (x.hotel ? '🏨' : '•')) + '</span><span class="tx">' + esc(x.title) + '</span>' + (x.hotel ? '<span class="b h">★</span>' : x.pin ? '<span class="b">' + x.pin + '</span>' : '<span></span>') + '</div>'; }).join('') + '</div>';
}
function legSummary(segs) {
  var t = { '🚶': 0, '🚇': 0, '🚕': 0, '🚄': 0 };
  segs.forEach(function (g) { t[g.m] = (t[g.m] || 0) + g.min; });
  var out = []; if (t['🚶']) out.push('เดิน ~' + t['🚶'] + ' นาที'); if (t['🚕']) out.push('Didi ~' + t['🚕'] + ' นาที'); if (t['🚇']) out.push('รถไฟฟ้า ~' + t['🚇'] + ' นาที'); if (t['🚄']) out.push('รถไฟ ~' + t['🚄'] + ' นาที');
  return out.join(' · ');
}
function inView(el) { var r = el.getBoundingClientRect(), l = el.closest('.list').getBoundingClientRect(); return r.height && r.top >= l.top - 4 && r.bottom <= l.bottom + 4; }
function rowFor(n) { return document.querySelector('.it[data-pin="' + n + '"]'); }
function scrollRow(r) { if (!r) return; var L2 = r.parentNode; L2.scrollTo({ top: r.offsetTop - L2.clientHeight / 2, behavior: 'smooth' }); }
function highlight(n, flyTo) {
  pinEls.forEach(function (m, k) { var el = m.getElement && m.getElement(); if (el) el.firstChild.classList.toggle('act', k + 1 === n); });
  document.querySelectorAll('.it').forEach(function (r) { r.classList.toggle('act', +r.dataset.pin === n); });
  if (flyTo && n && pinEls[n - 1]) map.flyTo(pinEls[n - 1].getLatLng(), Math.max(map.getZoom(), 15), { duration: reduce ? 0 : 1 });
}
function dayPts(d) { var pts = d.pins.map(function (p) { return [p[0], p[1]]; }); if (!d.suzhou) pts.push(HOTEL); return pts; }

function go(i, ready) {
  i = Math.max(0, Math.min(D.length - 1, i)); idx = i; var d = D[i], my = ++gen;
  document.body.classList.toggle('incity', !(d.ov || d.asia || i === 1));
  ui(); map.closePopup(); layer.clearLayers(); pinEls = []; segEls = []; if (plane) { map.removeLayer(plane); plane = null; }
  var c = $('#card');
  if (document.startViewTransition && !reduce && c.innerHTML) {
    document.startViewTransition(function () { if (my !== gen) return; card(d); bindList(); });
  } else {
    c.classList.add('out');
    setTimeout(function () { if (my !== gen) return; card(d); c.classList.remove('out'); bindList(); }, reduce ? 0 : 450);
  }
  var done = function () { if (my === gen && ready) ready(); };
  if (d.ov || d.asia) {
    var path = d.asia ? ARC_BACK : ARC_GO;
    cityTag(BKK, 'กรุงเทพฯ').addTo(layer); cityTag(PVG, 'เซี่ยงไฮ้').addTo(layer);
    fitTo([BKK, PVG], 6, 2.6);
    if (d.asia) { var tr = arcLine(path, reduce); setTimeout(function () { if (my === gen) fly(ARC_BACK, reduce ? 10 : 3600, function () { setTimeout(done, 1500); }, tr); }, reduce ? 0 : 2700); }
    else { var a0 = arcLine(path, true); setTimeout(function () { if (my === gen) { drawIn(a0.l, 2000); drawIn(a0.g, 2000); } }, reduce ? 0 : 2400); setTimeout(done, reduce ? 0 : 4800); }
    return;
  }
  var after = function () {
    if (my !== gen) return;
    if (!d.suzhou) hotelMk().addTo(layer);
    if (d.route.length > 1) { L.polyline(d.route, { color: '#b08a3e', weight: 9, opacity: .14, interactive: false }).addTo(layer); var rl = L.polyline(d.route, { color: '#b08a3e', weight: 3.5, opacity: .95, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(layer); drawIn(rl, 1500); }
    (d.segs || []).forEach(function (g, k) {
      var mid = [(g.a[0] + g.b[0]) / 2, (g.a[1] + g.b[1]) / 2];
      var m = L.marker(mid, { icon: L.divIcon({ className: '', html: '<span class="seg" style="animation-delay:' + (300 + k * 90) + 'ms">' + g.m + ' ' + g.min + '′</span>', iconSize: [0, 0] }), interactive: false, zIndexOffset: 300 });
      m.addTo(layer); segEls.push(m);
    });
    d.pins.forEach(function (p, k) {
      var im = (d.it.filter(function (x) { return x.pin === k + 1 && x.img; })[0] || {}).img;
      var m = L.marker([p[0], p[1]], { icon: L.divIcon({ className: '', html: '<div class="mpin' + (im ? '' : ' noimg') + '" style="animation-delay:' + (400 + k * 110) + 'ms' + (im ? ';background-image:url(' + im + ')' : '') + '">' + (im ? '<i>' + (k + 1) + '</i>' : (k + 1)) + '</div>', iconSize: [46, 46], iconAnchor: [23, 23] }), zIndexOffset: 600 + k });
      m.on('click', function () { stop(); gen++; map.closePopup(); highlight(k + 1, false); scrollRow(rowFor(k + 1)); });
      m.addTo(layer); pinEls.push(m);
    });
    setTimeout(done, reduce ? 0 : 900);
  };
  var pts = dayPts(d);
  if (i === 1) {  // day 1: fly the plane in first, then zoom to Shanghai
    cityTag(BKK, 'กรุงเทพฯ').addTo(layer); cityTag(PVG, 'เซี่ยงไฮ้').addTo(layer);
    fitTo([BKK, PVG], 6, 1.6); var tr1 = arcLine(ARC_GO, reduce);
    setTimeout(function () { if (my !== gen) return; fly(ARC_GO, reduce ? 10 : 3400, function () { if (my !== gen) return; document.body.classList.add('incity'); layer.clearLayers(); if (plane) { map.removeLayer(plane); plane = null; } fitTo(pts, 12, 2.6); setTimeout(after, reduce ? 0 : 2200); }, tr1); }, reduce ? 0 : 1700);
    return;
  }
  fitTo(pts, d.suzhou ? 14 : 15, 2.6);
  setTimeout(after, reduce ? 0 : 2000);
}

/* story mode: fly stop by stop, photo card pops up at each pin */
function story(done) {
  var d = D[idx], my = gen; if (!d.pins) { if (done) done(); return; }
  var stops = [], seen = {};
  d.it.forEach(function (x) { if (x.pin && !seen[x.pin + '|' + x.t]) { seen[x.pin + '|' + x.t] = 1; stops.push(x); } });
  var sb = $('#storyb'); if (sb) sb.textContent = '❚❚ หยุดเล่า';
  var head = $('.head'), old = $('.prog'); if (old) old.remove();
  if (head) head.insertAdjacentHTML('beforeend', '<div class="prog">' + stops.map(function () { return '<i><b></b></i>'; }).join('') + '</div>');
  var bars = document.querySelectorAll('.prog b');
  var k = 0;
  function finish() { if (sb && my === gen) sb.textContent = '▶ เล่นทีละจุด'; var pg = $('.prog'); if (pg && my === gen) { pg.classList.add('done'); setTimeout(function () { pg.remove(); }, 500); } map.closePopup(); highlight(0); segEls.forEach(function (s) { var e = s.getElement(); if (e) e.firstChild.classList.remove('act'); }); fitTo(dayPts(d), d.suzhou ? 14 : 15, 1.8); setTimeout(function () { if (my === gen && done) done(); }, reduce ? 0 : 2000); }
  function next() {
    if (my !== gen) return;
    if (k >= stops.length) { finish(); return; }
    var x = stops[k++], m = pinEls[x.pin - 1]; if (!m) { next(); return; }
    var bar = bars[k - 1]; if (bar) { bar.style.transitionDuration = (reduce ? 1.2 : 4.7) + 's'; bar.parentNode.classList.add('on'); }
    highlight(x.pin, false); scrollRow(rowFor(x.pin));
    segEls.forEach(function (s, j) { var e = s.getElement(); if (e) e.firstChild.classList.toggle('act', d.segs[j] && d.segs[j].b[0] === d.pins[x.pin - 1][0] && d.segs[j].b[1] === d.pins[x.pin - 1][1]); });
    map.closePopup();
    var z = 16, P = pad(), sz = map.getSize(), visB = sz.y - P.br[1], popH = innerWidth <= 820 ? 130 : 200;
    var pinX = (P.tl[0] + sz.x - P.br[0]) / 2, pinY = Math.min(visB - 16, (P.tl[1] + visB) / 2 + popH / 2);
    var ctr = map.unproject(map.project(m.getLatLng(), z).add([sz.x / 2 - pinX, sz.y / 2 - pinY]), z);
    if (Math.abs(map.getZoom() - z) < .01 && map.getBounds().pad(.5).contains(ctr)) map.panTo(ctr, { animate: !reduce, duration: 1.1, easeLinearity: .35 });
    else map.flyTo(ctr, z, { duration: reduce ? 0 : 1.4 });
    setTimeout(function () {
      if (my !== gen) return;
      var open = function () {
        L.popup({ className: 'story-pop', closeButton: false, autoPan: false, offset: [0, -24], maxWidth: 260 })
          .setLatLng(m.getLatLng())
          .setContent((x.img ? '<div class="sp-img" style="background-image:url(' + x.img + ')"></div>' : '') + '<div class="sp-t"><b>' + x.t + '</b> ' + esc(x.title) + '</div>')
          .openOn(map);
      };
      var row = rowFor(x.pin), ph = row && row.querySelector('.ph');
      if (document.startViewTransition && !reduce && x.img && ph && inView(ph)) {
        document.documentElement.classList.add('vtpic'); ph.style.viewTransitionName = 'pic';
        var cur = k;
        var vt = document.startViewTransition(function () {
          ph.style.viewTransitionName = ''; if (my !== gen || cur !== k) return; open();
          var im = $('.story-pop .sp-img'); if (im) { im.style.viewTransitionName = 'pic'; $('.story-pop').classList.add('morph'); }
        });
        vt.finished.finally(function () { document.documentElement.classList.remove('vtpic'); var im = $('.story-pop .sp-img'); if (im) im.style.viewTransitionName = ''; });
      } else open();
      setTimeout(next, reduce ? 1200 : 3000);
    }, reduce ? 0 : 1700);
  }
  next();
}
function bindList() {
  document.querySelectorAll('.ovr').forEach(function (r) { r.addEventListener('click', function () { stop(); go(+r.dataset.go); }); });
  document.querySelectorAll('.it[data-pin]').forEach(function (r) { r.addEventListener('click', function () { stop(); gen++; map.closePopup(); highlight(+r.dataset.pin, true); }); });
  var sb = $('#storyb');
  if (sb) sb.addEventListener('click', function () { if (sb.textContent.indexOf('หยุด') >= 0) { stop(); gen++; sb.textContent = '▶ เล่นทีละจุด'; map.closePopup(); return; } stop(); story(); });
}

var labels = ['ภาพรวม'].concat(D.slice(1).map(function (_, k) { return 'วัน ' + (k + 1); }));
var dots = $('#dots');
dots.innerHTML = labels.map(function (l, i) { return '<button data-i="' + i + '">' + l + '</button>'; }).join('') + '<span class="pill" aria-hidden="true"></span>';
var pill = dots.querySelector('.pill');
function movePill() { var b = dots.querySelector('button[aria-current=true]'); if (!b) return; pill.style.width = b.offsetWidth + 'px'; pill.style.height = b.offsetHeight + 'px'; pill.style.transform = 'translate(' + b.offsetLeft + 'px,' + b.offsetTop + 'px)'; pill.classList.add('on'); }
function ui() { setTimeout(movePill, 0); dots.querySelectorAll('button').forEach(function (b) { var on = +b.dataset.i === idx; b.setAttribute('aria-current', on); if (on) dots.scrollTo({ left: b.offsetLeft - dots.clientWidth / 2 + b.offsetWidth / 2, behavior: 'smooth' }); }); $('#prev').disabled = idx === 0; }
var autoB = $('#auto');
function stop() { if (playing) { playing = false; autoB.textContent = '▶ เล่นอัตโนมัติ'; } }
function nxt() { go(idx === D.length - 1 ? 0 : idx + 1); }
function playFrom(i) {
  if (!playing) return;
  go(i, function () {
    if (!playing) return;
    story(function () {
      if (!playing) return;
      if (i >= D.length - 1) { stop(); return; }
      setTimeout(function () { playFrom(i + 1); }, reduce ? 0 : 800);
    });
  });
}
dots.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { stop(); go(+b.dataset.i); } });
$('#next').onclick = function () { stop(); nxt(); };
$('#prev').onclick = function () { stop(); go(idx - 1); };
autoB.onclick = function () { if (playing) { stop(); gen++; map.closePopup(); return; } playing = true; autoB.textContent = '❚❚ หยุด'; playFrom(idx === D.length - 1 ? 0 : idx + 1); };
document.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight') { stop(); nxt(); } if (e.key === 'ArrowLeft') { stop(); go(idx - 1); } });
var rz, lastW = innerWidth; addEventListener('resize', function () { movePill(); clearTimeout(rz); rz = setTimeout(function () { if (Math.abs(innerWidth - lastW) > 40) { lastW = innerWidth; stop(); go(idx); } }, 300); });
go(0);
})();
</script>
