name: CMA weather
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/cma-weather.yml", "scripts/cma_wx.py"]
permissions:
  contents: write
jobs:
  wx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p data && python3 scripts/cma_wx.py --debug
      - name: Commit forecast
        run: |
          git config user.name "wx-bot"
          git config user.email "wx-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Update CMA weather" && git pull --rebase -q && git push)
