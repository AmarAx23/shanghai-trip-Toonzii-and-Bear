name: Commons photo fetch (one-off)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/commons-fetch.yml", "scripts/commons_fetch.py"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/commons_fetch.py
      - name: Commit candidates
        run: |
          git config user.name "wx-bot"
          git config user.email "wx-bot@users.noreply.github.com"
          git add _commons/
          git diff --cached --quiet || (git commit -m "Commons candidates" && git pull --rebase -q && git push)
